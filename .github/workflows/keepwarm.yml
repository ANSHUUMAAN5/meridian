name: Keep backend warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          if [ -z "${{ secrets.BACKEND_URL }}" ]; then
            echo "BACKEND_URL secret not set yet — skipping until the backend is deployed."
            exit 0
          fi
          curl -sf "${{ secrets.BACKEND_URL }}/health" || exit 1
