[project]
name = "meridian-backend"
version = "0.1.0"
description = "Meridian — multi-tenant multi-agent customer support platform"
requires-python = ">=3.11"

dependencies = [
  # web
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.12",      # file uploads
  "sse-starlette>=2.1",            # streaming answers + live trace

  # config & validation
  "pydantic>=2.9",
  "pydantic-settings>=2.6",

  # database
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pgvector>=0.3.6",
  "greenlet>=3.1",                 # required by sqlalchemy async

  # auth
  "pyjwt>=2.10",

  # retrieval — ONNX, no torch (keeps the deploy small)
  "fastembed>=0.4",
  "pypdf>=5.1",

  # llm providers
  "groq>=0.13",
  "google-genai>=0.3",
  "httpx>=0.27",                   # ollama, and provider fallbacks
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
